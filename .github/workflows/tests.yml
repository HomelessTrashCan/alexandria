name: Tests

# Läuft die pytest-Suite bei jedem Push/PR gegen eine echte MariaDB.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Nutzername/Passwort/DB-Name entsprechen den Defaults aus TestConfig, damit die Tests ohne zusätzliche Umgebungsvariablen laufen.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_ci_pw
          MARIADB_DATABASE: cmdb_test
          MARIADB_USER: cmdb_user
          MARIADB_PASSWORD: cmdb_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot_ci_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: pytest -v
