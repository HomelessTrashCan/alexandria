name: Tests

# Laeuft bei jedem Push und jedem Pull Request - der einzige Zweck dieser
# Pipeline ist aktuell, die pytest-Suite (tests/) automatisch gegen eine
# echte MariaDB laufen zu lassen, damit Regressionen sofort auffallen.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Ein Service-Container, den GitHub Actions parallel zum Job startet und
    # per Healthcheck erst freigibt, wenn MariaDB tatsaechlich bereit ist -
    # kein manuelles "warten" noetig. Nutzername/Passwort/DB-Name entsprechen
    # bewusst den Defaults aus backend/app/config.py (TestConfig), damit die
    # Tests hier ohne zusaetzliche Umgebungsvariablen laufen - genau wie lokal.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_ci_pw
          MARIADB_DATABASE: cmdb_test
          MARIADB_USER: cmdb_user
          MARIADB_PASSWORD: cmdb_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot_ci_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest -v
