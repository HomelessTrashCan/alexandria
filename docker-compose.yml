# Startet MariaDB und die Flask-App zusammen: docker compose up
#
# Container sprechen sich per Servicename an (hier "db"), kein
# host.docker.internal nötig. Zugangsdaten stehen nicht hier im File, sondern
# in .env (siehe .env.example) - docker compose liest .env automatisch und
# ersetzt die ${VARIABLE}-Platzhalter unten.
#
# docker/init-db/01-create-test-database.sql legt beim ersten Start
# zusätzlich "cmdb_test" für die pytest-Suite an, da MariaDB sonst nur eine
# einzige Datenbank automatisch erzeugt (MARIADB_DATABASE).

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - cmdb-db-data:/var/lib/mysql
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-u${MARIADB_USER}", "-p${MARIADB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: rr/alexandria:v1.0.1
    #build: rr/alexandria:v1.0.1 .
    depends_on:
      db:
        condition: service_healthy
    # DATABASE_URL wird trotz env_file erneut gesetzt: der Wert in .env ist
    # für lokale Entwicklung ausserhalb von Docker (Host "localhost").
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  cmdb-db-data:
